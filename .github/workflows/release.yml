name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    environment: release
    steps:
      - name: Check out the tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install the Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Make sure that the signing keys are present
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Set the environment secret TAURI_SIGNING_PRIVATE_KEY on the release environment. Make a key pair with: cargo tauri signer generate -w ~/.tauri/tokikagi.key"
            exit 1
          fi
          if grep -q "PENDING_GENERATE_WITH" src-tauri/tauri.conf.json; then
            echo "::error::src-tauri/tauri.conf.json still has the placeholder pubkey. Paste the public key that cargo tauri signer generate printed."
            exit 1
          fi

      - name: Build the app bundle
        env:
          APPLE_SIGNING_IDENTITY: "-"
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles app --config src-tauri/tauri.release.conf.json

      - name: Make sure that the bundle is complete
        run: |
          APP="src-tauri/target/release/bundle/macos/tokikagi.app"
          test -d "$APP"
          EXEC=$(plutil -extract CFBundleExecutable raw "$APP/Contents/Info.plist")
          test -x "$APP/Contents/MacOS/$EXEC"
          echo "Bundle executable: $EXEC"
          lipo -info "$APP/Contents/MacOS/$EXEC" || true
          codesign --verify --strict "$APP"

      - name: Package and hash
        run: |
          APP="src-tauri/target/release/bundle/macos/tokikagi.app"
          ditto -c -k --keepParent "$APP" tokikagi.app.zip
          shasum -a 256 tokikagi.app.zip > tokikagi.app.zip.sha256
          TARBALL="src-tauri/target/release/bundle/macos/tokikagi.app.tar.gz"
          test -f "$TARBALL"
          test -f "$TARBALL.sig"
          cp "$TARBALL" tokikagi.app.tar.gz
          cp "$TARBALL.sig" tokikagi.app.tar.gz.sig
          cat tokikagi.app.zip.sha256
          unzip -l tokikagi.app.zip | grep -q "tokikagi.app/Contents/Info.plist"

      - name: Write the update manifest
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          SIGNATURE=$(cat tokikagi.app.tar.gz.sig)
          URL="https://github.com/qunm00/TokiKagi/releases/download/$TAG/tokikagi.app.tar.gz"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "TokiKagi $TAG" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$SIGNATURE" \
            --arg url "$URL" \
            '{version: $version, notes: $notes, pub_date: $pub_date,
              platforms: {"darwin-aarch64": {signature: $signature, url: $url}}}' \
            > latest.json
          cat latest.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          FILES="tokikagi.app.zip tokikagi.app.zip.sha256 tokikagi.app.tar.gz tokikagi.app.tar.gz.sig latest.json"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES \
              --title "$TAG" --generate-notes --verify-tag
          fi
